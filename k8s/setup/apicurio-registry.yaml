apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: performance-testing
  labels:
    app: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      containers:
      - name: schema-registry
        # Using the lightweight in-memory variant
        image: apicurio/apicurio-registry-mem:2.4.4.Final 
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-svc
  namespace: performance-testing
spec:
  selector:
    app: schema-registry
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      