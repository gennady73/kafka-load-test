apiVersion: batch/v1
kind: Job
metadata:
  name: k6-scaled-test-consumer-metrics-web
  namespace: performance-testing
spec:
  # THE SCALING DIAL: Change this from 1 to 3 to instantly scale out
  parallelism: 1
  completions: 1 # Must match parallelism so the Job knows when it is fully "Done"
  backoffLimit: 0 
  template:
    metadata:
      labels:
        app: k6-scaled-test-producer-consumer
    spec:
      restartPolicy: Never

      # Required so the init context doesn't crash on open()
      initContainers:
      - name: payload-generator
        image: docker.io/gennady73/k6v2ubi9 
        command: ["/bin/bash", "/script/generate-payloads.sh"]
        volumeMounts:
        - name: script-volume
          mountPath: /script
        - name: payload-volume
          mountPath: /mnt/payloads

      containers:
      - name: k6-runner
        image: docker.io/gennady73/k6v2ubi9
        imagePullPolicy: Always # IfNotPresent

        workingDir: /tmp

        command: 
          - "/bin/sh"
          - "-c"
          - >
            k6 run --out json=/tmp/raw-metrics.json /script/kafka-perf-framework.js && 
            sleep 5 && 
            curl -X POST --data-binary @/tmp/raw-metrics.json "http://k6-aggregator.performance-testing.svc:8080/upload/${POD_NAME}.json?role=consumer&total=${EXPECTED_PODS}"

        env:
          - name: KAFKA_BROKERS
            value: "observ-kafka-kafka-bootstrap.observ-kafka.svc:9092"
          - name: SCHEMA_REGISTRY_URL
            value: "http://registry-svc.performance-testing.svc:8080/apis/ccompat/v6"

          # Match the producer topic
          - name: KAFKA_TOPIC
            value: "performance_evaluation_pb_v1"

          # Critical for the consumer to accept more than 1MB incoming records
          - name: CLIENT_MAX_BYTES
            value: "104857600" # 100MB 
  
          - name: EXPECTED_PODS
            value: "1" 
          - name: TEST_DURATION
            value: "10s"

          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

          # THE ROLE DIAL: Set to "PRODUCER" or "CONSUMER"
          - name: TEST_ROLE
            value: "CONSUMER" 
          
          - name: SERIALIZATION_TYPE
            value: "PROTOBUF"
          
          # THE LOAD DIAL: Remember this is PER POD
          - name: TARGET_RPS
            value: "1"
          - name: MAX_VUS
            value: "2"
          - name: GOMAXPROCS
            value: "2"
          - name: PAYLOAD_SIZE
            value: "5m" # Dynamically select "256b", "1k", "1m", or "5m"

        resources:
          requests:
            cpu: "2000m"
            memory: "2048Mi"
          limits:
            cpu: "3000m"      
            memory: "2048Mi"
        volumeMounts:
        - name: script-volume
          mountPath: /script
        # Mount the payload volume
        - name: payload-volume
          mountPath: /mnt/payloads

      volumes:
      - name: script-volume
        configMap:
          name: kafka-perf-script
      # Define the emptyDir volume
      - name: payload-volume
        emptyDir:
          sizeLimit: 50Mi
