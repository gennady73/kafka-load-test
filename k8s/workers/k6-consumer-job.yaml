apiVersion: batch/v1
kind: Job
metadata:
  name: k6-scaled-test-consumer
  namespace: performance-testing
spec:
  # THE SCALING DIAL: Change this from 1 to 3 to instantly scale out
  parallelism: 3
  completions: 3 # Must match parallelism so the Job knows when it is fully "Done"
  backoffLimit: 0 
  template:
    metadata:
      labels:
        app: k6-scaled-test-producer-consumer
    spec:
      restartPolicy: Never
      containers:
      - name: k6-runner
        image: docker.io/gennady73/k6v2ubi9
        command: ["k6", "run", "/script/kafka-perf-framework.js"]
        env:
          - name: KAFKA_BROKERS
            value: "observ-kafka-kafka-bootstrap.observ-kafka.svc:9092"
          - name: SCHEMA_REGISTRY_URL
            value: "http://registry-svc.performance-testing.svc:8080/apis/ccompat/v6"
          - name: KAFKA_TOPIC
            value: "performance_evaluation_pipeline_pb"
          
          # THE ROLE DIAL: Set to "PRODUCER" or "CONSUMER"
          - name: TEST_ROLE
            value: "CONSUMER" 
          
          - name: SERIALIZATION_TYPE
            value: "PROTOBUF"
          
          # THE LOAD DIAL: Remember this is PER POD
          - name: TARGET_RPS
            value: "2500" 
          - name: MAX_VUS
            value: "5"       
          - name: GOMAXPROCS
            value: "2" 

        resources:
          requests:
            cpu: "2000m"
            memory: "2048Mi"
          limits:
            cpu: "3000m"      
            memory: "2048Mi"  # Given your metrics, give it some breathing room
        volumeMounts:
        - name: script-volume
          mountPath: /script
      volumes:
      - name: script-volume
        configMap:
          name: kafka-perf-script
