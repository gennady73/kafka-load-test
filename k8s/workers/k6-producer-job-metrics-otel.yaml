apiVersion: batch/v1
kind: Job
metadata:
  name: k6-scaled-test-producer-metrics-otel
  namespace: performance-testing
spec:
  # THE SCALING DIAL: Change this from 1 to 3 to instantly scale out
  parallelism: 3 
  completions: 3 # Must match parallelism so the Job knows when it is fully "Done"
  backoffLimit: 0 
  template:
    metadata:
      labels:
        app: k6-load-test-producer-consumer
    spec:
      restartPolicy: Never
      containers:
      - name: k6-runner
        image: docker.io/gennady73/k6v2ubi9
        command: ["k6", "run", "--out", "opentelemetry", "/script/kafka-perf-framework.js"]
        env:
          - name: KAFKA_BROKERS
            value: "observ-kafka-kafka-bootstrap.observ-kafka.svc:9092"
          - name: SCHEMA_REGISTRY_URL
            value: "http://registry-svc.performance-testing.svc:8080/apis/ccompat/v6"
          - name: KAFKA_TOPIC
            value: "performance_evaluation_pipeline_pb"
          
          # THE ROLE DIAL: Set to "PRODUCER" or "CONSUMER"
          - name: TEST_ROLE
            value: "PRODUCER" 
          
          - name: SERIALIZATION_TYPE
            value: "PROTOBUF"
          
          # THE LOAD DIAL: Remember this is PER POD
          - name: TARGET_RPS
            value: "2500" 
          - name: MAX_VUS
            value: "100"       
          - name: GOMAXPROCS
            value: "2" 

          # 2. POINT TO OTEL COLLECTOR gRPC PORT (Usually 4317)
          # Format: <service-name>.<namespace>.svc:4317
          # - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
          #   value: "opentelemetry-kube-stack-gateway-collector.opentelemetry-operator-system.svc:4317"
          # - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
          #   value: "k6-otel-svc.performance-testing.svc:4317"
          - name: K6_OTEL_GRPC_EXPORTER_ENDPOINT
            value: "k6-metrics-bridge-collector.performance-testing.svc:4317"

          # 3. DISABLE TLS FOR INTERNAL SDN TRAFFIC
          - name: K6_OTEL_GRPC_EXPORTER_INSECURE
            value: "true"
            
          # 4. ADD A CLEAN PREFIX FOR OPENOBSERVE
          - name: K6_OTEL_METRIC_PREFIX
            value: "k6_"
            
          # 5. DEFINE THE SERVICE NAME FOR OTEL
          - name: K6_OTEL_SERVICE_NAME
            value: "k6-kafka-producer-test" # Change to "consumer-test" in the other manifest

        resources:
          requests:
            cpu: "2000m"
            memory: "2048Mi"
          limits:
            cpu: "2000m"      
            memory: "6656Mi"  # Given your metrics, give it some breathing room
        volumeMounts:
        - name: script-volume
          mountPath: /script
      volumes:
      - name: script-volume
        configMap:
          name: kafka-perf-script
