apiVersion: batch/v1
kind: Job
metadata:
  name: k6-base-producer-test
  namespace: performance-testing
spec:
  # THE SCALING DIAL: Change this from 1 to 3 to instantly scale out
  parallelism: 2 
  completions: 2 # Must match parallelism so the Job knows when it is fully "Done"
  backoffLimit: 0 
  template:
    metadata:
      labels:
        app: k6-load-test
    spec:
      restartPolicy: Never
      
      initContainers:
      - name: payload-generator
        image: docker.io/gennady73/k6v2ubi9 # Reusing image since it has bash/tr/head
        command: ["/bin/bash", "/script/generate-payloads.sh"]
        volumeMounts:
        - name: script-volume
          mountPath: /script
        - name: payload-volume
          mountPath: /mnt/payloads

      containers:
      - name: k6-runner
        image: docker.io/gennady73/k6v2ubi9

        workingDir: /tmp

        command: ["k6", "run", "/script/kafka-perf-framework.js"]
        env:
          - name: KAFKA_BROKERS
            value: "observ-kafka-kafka-bootstrap.observ-kafka.svc:9092"
          - name: SCHEMA_REGISTRY_URL
            value: "http://registry-svc.performance-testing.svc:8080/apis/ccompat/v6"
          - name: KAFKA_TOPIC
            value: "performance_evaluation_pipeline_pb"

          # The pod passes its expected parallelism to the aggregator and runs for given duration  
          - name: EXPECTED_PODS
            value: "1" 
          - name: TEST_DURATION
            value: "30s"

          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

          # THE ROLE DIAL: Set to "PRODUCER" or "CONSUMER"
          - name: TEST_ROLE
            value: "PRODUCER" 

          - name: SERIALIZATION_TYPE
            value: "PROTOBUF"
          - name: COMPRESSION_TYPE
            value: "ZSTD"
          # THE LOAD DIAL: Remember this is PER POD
          - name: TARGET_RPS
            value: "1"
          - name: MAX_VUS
            value: "2"
          - name: GOMAXPROCS
            value: "2"
          - name: PAYLOAD_SIZE
            value: "5m" # Dynamically select "256b", "1k", "1m", or "5m"

        resources:
          requests:
            cpu: "4000m"
            memory: "2048Mi"
          limits:
            cpu: "8000m"      
            memory: "8096Mi"  

        volumeMounts:
        - name: script-volume
          mountPath: /script
        - name: payload-volume
          mountPath: /mnt/payloads

      volumes:
      - name: script-volume
        configMap:
          name: kafka-perf-script
      - name: payload-volume
        emptyDir:
          sizeLimit: 50Mi
