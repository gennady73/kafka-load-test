apiVersion: batch/v1
kind: Job
metadata:
  name: k6-base-producer-test
  namespace: performance-testing
spec:
  backoffLimit: 0 
  template:
    metadata:
      labels:
        app: k6-load-test
    spec:
      restartPolicy: Never
      containers:
      - name: k6-runner
        image: docker.io/gennady73/k6v2ubi9
        command: ["k6", "run", "/script/kafka-perf-framework.js"]
        env:
          - name: KAFKA_BROKERS
            value: "observ-kafka-kafka-bootstrap.observ-kafka.svc:9092"
          # Point k6 to the new lightweight registry you just deployed
          - name: SCHEMA_REGISTRY_URL
            value: "http://registry-svc.performance-testing.svc:8080/apis/ccompat/v6"
          - name: KAFKA_TOPIC
            value: "performance_evaluation_pipeline_pb"
          - name: SERIALIZATION_TYPE
            value: "PROTOBUF"
          - name: TEST_ROLE
            value: "PRODUCER"
          - name: COMPRESSION_TYPE
            value: "ZSTD"
          - name: TARGET_RPS
            value: "8000"
          - name: MAX_VUS
            value: "100"       
          # THE CGROUP FIX
          - name: GOMAXPROCS
            value: "4" 

        resources:
          requests:
            cpu: "4000m"
            memory: "2048Mi"
          limits:
            cpu: "8000m"      
            memory: "8096Mi"  

        volumeMounts:
        - name: script-volume
          mountPath: /script

      volumes:
      - name: script-volume
        configMap:
          name: kafka-perf-script
