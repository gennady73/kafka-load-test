apiVersion: v1
kind: Service
metadata:
  name: k6-aggregator
  namespace: performance-testing
spec:
  selector:
    app: k6-aggregator
  ports:
    - name: http-report
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: http-replay
      protocol: TCP
      port: 5665
      targetPort: 5665
